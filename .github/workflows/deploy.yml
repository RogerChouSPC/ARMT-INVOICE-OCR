# CI: verify the Docker image builds on push to master.
# Production deploy is done on the server via OliveTin (git pull + docker compose build).
# See deploy/README.md.

name: CI Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          build-args: |
            VITE_AZURE_CLIENT_ID=00000000-0000-0000-0000-000000000000
            VITE_AZURE_TENANT_ID=00000000-0000-0000-0000-000000000000
            VITE_BASE_PATH=/armt-invoice-ocr/
