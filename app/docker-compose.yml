# Run on the company server:  docker compose up -d --build
#
# Requires app/.env (copy from app/.env.example). Never commit .env.

services:
  app:
    image: armt-invoice-ocr:local
    container_name: armt-invoice-ocr
    build:
      context: .
      args:
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/armt-invoice-ocr/}
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      PORT: 3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    restart: unless-stopped
